<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Zone</title>

<style>

body {

  margin: 0;

  font-family: Arial, sans-serif;

  background: #f4f7fb;

  color: #111;

}

.zone-page {

  max-width: 1400px;

  margin: 0 auto;

  padding: 20px;

}

.hero {

  height: 260px;

  border-radius: 32px;

  overflow: hidden;

  position: relative;

  margin-bottom: 40px;

}

.hero img {

  width: 100%;

  height: 100%;

  object-fit: cover;

}

.hero-overlay {

  position: absolute;

  inset: 0;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,0.65),
      rgba(0,0,0,0.15)
    );

  display: flex;

  align-items: end;

  padding: 30px;

}

.hero-title {

  color: white;

  font-size: 42px;

  font-weight: bold;

}

.section-title {

  font-size: 30px;

  margin-bottom: 20px;

}

.beach-row {

  display: flex;

  gap: 20px;

  overflow-x: auto;

  scroll-snap-type: x mandatory;

  padding-bottom: 10px;

  scrollbar-width: none;

}

.beach-row::-webkit-scrollbar {

  display: none;

}

.beach-card {

  min-width: 320px;

  background: white;

  border-radius: 28px;

  overflow: hidden;

  flex-shrink: 0;

  cursor: pointer;

  transition: 0.25s;

  box-shadow:
    0 6px 24px rgba(0,0,0,0.08);

  scroll-snap-align: start;

}

.beach-card:hover {

  transform: translateY(-6px);

}

.beach-card img {

  width: 100%;

  height: 220px;

  object-fit: cover;

}

.beach-content {

  padding: 18px;

}

.beach-name {

  font-size: 24px;

  font-weight: bold;

  margin-bottom: 12px;

}

.beach-info {

  display: flex;

  justify-content: space-between;

  font-size: 16px;

  color: #555;

}

.quick-buttons {

  display: grid;

  grid-template-columns:
    repeat(auto-fit, minmax(180px, 1fr));

  gap: 18px;

  margin-top: 50px;

}

.quick-btn {

  background: white;

  border-radius: 24px;

  padding: 24px;

  text-align: center;

  font-size: 20px;

  font-weight: bold;

  cursor: pointer;

  transition: 0.25s;

  box-shadow:
    0 5px 20px rgba(0,0,0,0.08);

}

.quick-btn:hover {

  transform: scale(1.03);

}

@media (max-width: 768px) {

  .hero {

    height: 190px;

  }

  .hero-title {

    font-size: 30px;

  }

  .beach-card {

    min-width: 280px;

  }

}

</style>

</head>

<body>

<div class="zone-page">

  <div class="hero">

    <img
      id="heroImage"
      src=""
    >

    <div class="hero-overlay">

      <div
        class="hero-title"
        id="zoneTitle">
      </div>

    </div>

  </div>

  <div class="section-title">

    Beaches

  </div>

  <div
    class="beach-row"
    id="beachRow">
  </div>

  <div class="quick-buttons">

    <div class="quick-btn">
      🏨 Accommodation
    </div>

    <div class="quick-btn">
      🍴 Restaurants
    </div>

    <div class="quick-btn">
      🍹 Beach Bars
    </div>

    <div class="quick-btn">
      🚗 Car Rentals
    </div>

    <div class="quick-btn">
      🛥 Boat Rentals
    </div>

    <div class="quick-btn">
      🎯 Activities
    </div>

  </div>

</div>

<script>

async function loadZone() {

  const params =
    new URLSearchParams(window.location.search);

  const zoneId =
    params.get("id");

  document.getElementById("zoneTitle")
    .innerText =
      zoneId;

  document.getElementById("heroImage")
    .src =
`https://raw.githubusercontent.com/gabridim18-lab/halkidiki-data/main/data/beaches/thessaloniki/images/thessaloniki1.webp`;

  const response =
    await fetch(

`https://raw.githubusercontent.com/gabridim18-lab/halkidiki-data/main/data/beaches/beaches-index.json`

    );

  const beaches =
    await response.json();

  const filtered =
    beaches.filter(

      item =>

item.zone.toLowerCase() ===
zoneId.toLowerCase()

    );

  const beachRow =
    document.getElementById("beachRow");

  filtered.forEach(beach => {

    const image =

`https://raw.githubusercontent.com/gabridim18-lab/halkidiki-data/main/data/beaches/${beach.id}/images/${beach.previewImage}`;

    beachRow.innerHTML += `

      <div
        class="beach-card"
        onclick="openBeach('${beach.id}')"
      >

        <img src="${image}">

        <div class="beach-content">

          <div class="beach-name">

            ${beach.name.en}

          </div>

          <div class="beach-info">

            <span>
              🌊 ${beach.waterTemperature}°C
            </span>

            <span>
              ⭐ ${beach.rating}
            </span>

          </div>

        </div>

      </div>

    `;

  });

}

function openBeach(id) {

  window.location.href =
`beach.html?id=${id}`;

}

loadZone();

</script>

</body>
</html>
