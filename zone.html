<!DOCTYPE html>
<html lang="en">

<head>

  <link rel="icon" type="image/png" href="favicon-32x32.png">

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Zone</title>

<style>

body {

  margin: 0;

  font-family: Arial, sans-serif;

  background: #f4f7fb;

  color: #111;

}

.zone-page {

  max-width: 1400px;

  margin: 0 auto;

  padding: 20px;

}

.hero {

  height: 260px;

  border-radius: 32px;

  overflow: hidden;

  position: relative;

  margin-bottom: 40px;

}

.hero img {

  width: 100%;

  height: 100%;

  object-fit: cover;

}

.hero-overlay {

  position: absolute;

  inset: 0;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,0.65),
      rgba(0,0,0,0.15)
    );

  display: flex;

  align-items: end;

  padding: 30px;

}

.hero-title {

  color: white;

  font-size: 42px;

  font-weight: bold;

}

.section-title {

  font-size: 30px;

  margin-bottom: 20px;

}

.beach-row {

  display: flex;

  gap: 20px;

  overflow-x: auto;

  scroll-snap-type: x mandatory;

  padding-bottom: 10px;

  scrollbar-width: none;

}

.beach-row::-webkit-scrollbar {

  display: none;

}

.beach-card {

  position: relative;

  min-width: 320px;

  height: 200px;

  border-radius: 28px;

  overflow: hidden;

  flex-shrink: 0;

  cursor: pointer;

  transition: 0.3s ease;

  scroll-snap-align: start;

  box-shadow:
    0 6px 24px rgba(0,0,0,0.10);

}

.beach-card:hover {

  transform: translateY(-4px);

}

.beach-card:hover img {

  transform: scale(1.04);

}

.beach-card img {

  width: 100%;

  height: 100%;

  object-fit: cover;

  transition: 0.4s ease;

}

.beach-overlay {

  position: absolute;

  inset: 0;

  display: flex;

  flex-direction: column;

  justify-content: flex-end;

  padding: 18px;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,0.18),
      transparent 45%
    );

}

.beach-temp {

  position: absolute;

  top: 10px;

  right: 10px;

  background:
    rgba(30,30,30,0.45);

  backdrop-filter: blur(6px);

  color: white;

  height: 28px;

  padding:
    0 8px;

  border-radius: 999px;

  font-size: 15px;

  font-weight: 700;

  display: flex;

  align-items: center;

  gap: 2px;

  line-height: 1;

}
.weather-icon {

  width: 18px;

  height: 18px;

  object-fit: contain;

}

.beach-bottom {

  display: flex;

  justify-content: space-between;

  align-items: flex-end;

  margin-top: auto;

}

.beach-name {

  color: white;

  font-size: 26px;

  font-weight: bold;

  max-width: 70%;

  text-shadow:
    0 2px 10px rgba(0,0,0,0.35);

}

.beach-rating {

  background:
    rgba(255,255,255,0.20);

  backdrop-filter: blur(10px);

  color: white;

  padding:
    6px 12px;

  border-radius: 999px;

  font-size: 15px;

  font-weight: bold;

  margin-bottom: 4px;

}


.quick-buttons {

  display: grid;

  grid-template-columns:
    repeat(auto-fit, minmax(180px, 1fr));

  gap: 18px;

  margin-top: 50px;

}

.quick-btn {

  background: white;

  border-radius: 24px;

  padding: 18px 12px;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  gap: 14px;

  cursor: pointer;

  transition: 0.25s ease;

  box-shadow:
    0 5px 20px rgba(0,0,0,0.06);

  min-height: 92px;

}

.quick-btn-icon {

  width: 42px;

  height: 42px;

  object-fit: contain;

}

.quick-btn-text {

  font-size: 16px;

  font-weight: 700;

  color: #16214a;

  text-align: center;

  line-height: 1.2;

}

.quick-btn:hover {

  transform: translateY(-4px);

}

.quick-btn:hover {

  transform: scale(1.03);

}

@media (max-width: 768px) {

  .hero {

    height: 190px;

  }

  .hero-title {

    font-size: 30px;

  }

  .beach-card {

    min-width: 280px;

  }

}
.site-footer {
  background: #000;
  color: white;
  padding: 30px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
  margin-top: 60px;
}

.footer-left {
  font-size: 14px;
  opacity: 0.85;
}

.footer-right {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
}

.footer-right a {
  color: white;
  text-decoration: none;
  font-size: 14px;
}
.zone-expandable-content {
  grid-column: 1 / -1;
  margin-top: 10px;
  display: none;
}

.zone-expandable-content.active {
  display: block;
}

.zone-results-title {
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 18px;
}

.zone-results-row {
  display: flex;
  gap: 18px;
  overflow-x: auto;
  padding-bottom: 12px;
}

.zone-accommodation-card {
  min-width: 300px;
  max-width: 300px;
  background: white;
  border-radius: 26px;
  overflow: hidden;
  flex-shrink: 0;
  cursor: pointer;
  box-shadow: 0 8px 26px rgba(0,0,0,0.10);
}

.zone-accommodation-card img {
  width: 100%;
  height: 190px;
  object-fit: cover;
}

.zone-accommodation-info {
  padding: 16px;
}

.zone-accommodation-title {
  font-size: 18px;
  font-weight: 800;
  color: #111;
  line-height: 1.2;
  margin-bottom: 10px;
}

.zone-accommodation-meta-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.zone-rating-badge {
  background: #0077ff;
  color: white;
  min-width: 42px;
  height: 34px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 900;
}

.zone-accommodation-details {
  font-size: 14px;
  font-weight: 700;
  color: #555;
}

.zone-accommodation-category {
  display: inline-block;
  padding: 7px 12px;
  border-radius: 999px;
  background: #eef4ff;
  color: #0066ff;
  font-size: 12px;
  font-weight: 800;
  text-transform: capitalize;
}
.smart-quick-btn {
  position: relative;
}

.quick-btn-hint {
  font-size: 12px;
  font-weight: 700;
  color: #0077ff;
  opacity: 0.85;
  margin-top: -6px;
}

.zone-expandable-content {
  grid-column: 1 / -1;
  margin-top: -4px;
  margin-bottom: 20px;
  display: none;
}
.zone-food-card {
  min-width: 300px;
  max-width: 300px;
  background: rgb(245, 253, 172);
  border-radius: 30px;
  overflow: hidden;
  flex-shrink: 0;
  cursor: pointer;
  position: relative;
  box-shadow: 0 14px 38px rgba(0,0,0,0.14);
  transition: 0.3s ease;
}

.zone-food-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 18px 46px rgba(0,0,0,0.18);
}

.zone-food-image-wrap {
  height: 210px;
  position: relative;
  overflow: hidden;
}

.zone-food-image-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: 0.4s ease;
}

.zone-food-card:hover img {
  transform: scale(1.06);
}

.zone-food-gradient {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to top,
    rgba(0,0,0,0.62),
    rgba(0,0,0,0.05)
  );
}

.zone-food-rating {
  position: absolute;
  top: 14px;
  right: 14px;
  background: #0077ff;
  color: white;
  min-width: 44px;
  height: 36px;
  border-radius: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 900;
  box-shadow: 0 8px 20px rgba(0,119,255,0.35);
}

.zone-food-type {
  position: absolute;
  left: 14px;
  bottom: 14px;
  background: rgba(255,255,255,0.92);
  color: #0b3d91;
  padding: 8px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.zone-food-card.locked {
  cursor: default;
}

.zone-food-card.locked:hover {
  transform: none;
}

.zone-food-soon {
  position: absolute;
  top: 14px;
  left: 14px;
  background: rgba(255,255,255,0.94);
  color: #16214a;
  padding: 8px 12px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 900;
  text-transform: uppercase;
}
.zone-food-info {
  padding: 18px;
}

.zone-food-title {
  font-size: 20px;
  font-weight: 900;
  color: #111;
  line-height: 1.15;
  margin-bottom: 10px;
}
.zone-food-beach {
  font-size: 12px;
  font-weight: 900;
  color: #0077ff;
  margin-bottom: 8px;
  text-transform: capitalize;
}
.zone-food-desc {
  font-size: 14px;
  font-weight: 600;
  color: #555;
  line-height: 1.35;
  margin-bottom: 12px;

  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.zone-food-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.zone-food-price {
  background: #f0f6ff;
  color: #0077ff;
  padding: 7px 11px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 900;
}

.zone-food-features {
  font-size: 12px;
  font-weight: 800;
  color: #16214a;
  opacity: 0.75;
  text-align: right;
}
</style>

</head>

<body>

<div class="zone-page">

  <div class="hero">

    <img
      id="heroImage"
      src=""
    >

    <div class="hero-overlay">

      <div
        class="hero-title"
        id="zoneTitle">
      </div>

    </div>

  </div>

  <div class="section-title">

    Beaches

  </div>

  <div
    class="beach-row"
    id="beachRow">
  </div>

  <div class="quick-buttons">

<div
  class="quick-btn smart-quick-btn"
  onclick="toggleZoneSection('accommodation')"
>

  <img
    class="quick-btn-icon"
    src="icons/accommodation.png"
  >

  <div class="quick-btn-text">
    Accommodation
  </div>

  <div class="quick-btn-hint">
    Tap to view stays ▼
  </div>

</div>

<div
  id="zoneAccommodationContent"
  class="zone-expandable-content"
></div>

<div
  class="quick-btn smart-quick-btn"
  onclick="toggleZoneSection('restaurant')"
>

  <img
    class="quick-btn-icon"
    src="icons/restaurants.png"
  >

  <div class="quick-btn-text">
    Restaurants
  </div>

  <div class="quick-btn-hint">
    Tap to view restaurants ▼
  </div>

</div>

<div
  id="zoneRestaurantContent"
  class="zone-expandable-content"
></div>

<div
  class="quick-btn smart-quick-btn"
  onclick="toggleZoneSection('beach_bar')"
>

  <img
    class="quick-btn-icon"
    src="icons/beachbars.png"
  >

  <div class="quick-btn-text">
    Beach Bars
  </div>

  <div class="quick-btn-hint">
    Tap to view beach bars ▼
  </div>

</div>

<div
  id="zoneBeachBarContent"
  class="zone-expandable-content"
></div>

  <div class="quick-btn">

    <img
      class="quick-btn-icon"
      src="icons/carrental.png"
    >

  </div>

  <div class="quick-btn">

    <img
      class="quick-btn-icon"
      src="icons/carrental.png"
    >

    <div class="quick-btn-text">
      Car Rentals
    </div>

  </div>

  <div class="quick-btn">

    <img
      class="quick-btn-icon"
      src="icons/boat.png"
    >

    <div class="quick-btn-text">
      Boat Rentals
    </div>

  </div>

  <div class="quick-btn">

    <img
      class="quick-btn-icon"
      src="icons/activities.png"
    >

    <div class="quick-btn-text">
      Activities
    </div>

  </div>

 

</div>


</div>

<script>

async function loadZone() {

  const params =
    new URLSearchParams(window.location.search);

  const zoneId =
    params.get("id");

  document.getElementById("zoneTitle")
    .innerText =
      zoneId;

const heroImages = {

  thessaloniki:
"images/thessaloniki1.webp",

  kassandra:
"images/kassandra1.webp",

  sithonia:
"images/sithonia1.webp",

  olympiada:
"images/olympiada1.webp"

};

document.getElementById("heroImage")
  .src =
    heroImages[
      zoneId.toLowerCase()
    ];
  const response =
    await fetch(

`https://raw.githubusercontent.com/gabridim18-lab/halkidiki-data/main/data/beaches/beaches-index.json`

    );

  const beaches =
    await response.json();

  const filtered =
    beaches.filter(

      item =>

item.zone.toLowerCase() ===
zoneId.toLowerCase()

    );

const beachRow =
  document.getElementById("beachRow");

for (const beach of filtered) {

  console.log(beach);

  const image =

`https://raw.githubusercontent.com/gabridim18-lab/halkidiki-data/main/data/beaches/${beach.id}/images/${beach.previewImage}`;

let temp = "--";
let weatherIcon = "";

if (beach.coordinates) {

  const weatherUrl =

`https://api.weatherapi.com/v1/forecast.json?key=43c0c7ca861d47b48dc160903250408&q=${beach.coordinates.lat},${beach.coordinates.lon}&days=1&aqi=no&alerts=no`;

  try {

    const weatherResponse =
      await fetch(weatherUrl);

    const weatherData =
      await weatherResponse.json();

    if (weatherData.current) {

      temp =
        Math.round(
          weatherData.current.temp_c
        );

      weatherIcon =
        weatherData.current.condition.icon;

    }

  } catch (e) {

    console.log(
      "Weather error:",
      e
    );

  }

}

  beachRow.innerHTML += `

    <div
      class="beach-card"
      onclick="openBeach('${beach.id}')"
    >

      <img src="${image}">

      <div class="beach-overlay">

        <div class="beach-temp">

          <img
            class="weather-icon"
            src="https:${weatherIcon}"
          >

          ${temp}°

        </div>

        <div class="beach-bottom">

          <div class="beach-name">
            ${beach.name.en}
          </div>

          <div class="beach-rating">
            ⭐ ${beach.rating}
          </div>

        </div>

      </div>

    </div>

  `;

}
}
function openBeach(id) {

  window.location.href =
`beach.html?id=${id}`;

}
function openAccommodation(id) {

  window.location.href =
    `accommodation.html?id=${id}`;

}
function openRestaurant(id) {

  window.location.href =
    `place.html?id=${id}`;

}
let currentSection = null;

async function toggleZoneSection(type) {

  const containers = {
    accommodation: document.getElementById("zoneAccommodationContent"),
    restaurant: document.getElementById("zoneRestaurantContent"),
    beach_bar: document.getElementById("zoneBeachBarContent")
  };

  const container =
    containers[type];

  Object.values(containers).forEach(box => {
    box.classList.remove("active");
    box.innerHTML = "";
  });

  if (currentSection === type) {
    currentSection = null;
    return;
  }

  currentSection = type;
  container.classList.add("active");

  const params =
    new URLSearchParams(window.location.search);

  const zoneId =
    params.get("id");

  let items = [];

  try {

    if (type === "accommodation") {

      const response =
        await fetch(
          "https://raw.githubusercontent.com/gabridim18-lab/halkidiki-data/main/data/accommodations/accommodations-index-v2.json"
        );

      const data =
        await response.json();

      items =
        data.filter(item =>
          item.zone &&
          item.zone.toLowerCase() === zoneId.toLowerCase()
        );

    }

    if (type === "restaurant" || type === "beach_bar") {

      const response =
        await fetch(
          "https://raw.githubusercontent.com/gabridim18-lab/halkidiki-data/main/data/restaurants/restaurants-index.json"
        );

      const data =
        await response.json();

      items =
        data.filter(item =>
          item.zone &&
          item.zone.toLowerCase() === zoneId.toLowerCase() &&
          item.type === type
        );

    }

  } catch (e) {
    console.log(e);
  }

  const title =
    type === "accommodation"
      ? "Accommodation"
      : type === "restaurant"
        ? "Restaurants"
        : "Beach Bars";

  if (type === "accommodation") {

    container.innerHTML = `

      <div class="zone-results-title">
        ${title} (${items.length})
      </div>

      <div class="zone-results-row">

        ${items.map(item => `

          <div
            class="zone-accommodation-card"
            onclick="openAccommodation('${item.id}')"
          >

            <img src="${item.image}">

            <div class="zone-accommodation-info">

              <div class="zone-accommodation-title">
                ${item.titleEn}
              </div>

              <div class="zone-accommodation-meta-row">

                <div class="zone-rating-badge">
                  ${item.rating}
                </div>

                <div class="zone-accommodation-details">
                  👥 ${item.guests} guests · 🛏 ${item.bedrooms}
                </div>

              </div>

              <div class="zone-accommodation-category">
                ${item.category.replaceAll("_", " ")}
              </div>

            </div>

          </div>

        `).join("")}

      </div>

    `;

    return;

  }

  container.innerHTML = `

    <div class="zone-results-title">
      ${title} (${items.length})
    </div>

    <div class="zone-results-row">

      ${items.map(item => `

       <div
  class="zone-food-card ${item.featured === true ? "" : "locked"}"
  ${item.featured === true ? `onclick="openRestaurant('${item.id}')"` : ""}
>

          <div class="zone-food-image-wrap">

            <img src="${item.image}">

            <div class="zone-food-gradient"></div>

            <div class="zone-food-rating">
              ${item.rating}
            </div>
${item.featured === true ? "" : `
  <div class="zone-food-soon">
    Preview
  </div>
`}
            <div class="zone-food-type">
  ${(item.beachSlug || "").replaceAll("-", " ")}
</div>

          </div>

          <div class="zone-food-info">

            <div class="zone-food-title">
              ${item.titleEn}
            </div>

<div class="zone-food-desc">
  ${item.shortEn || ""}
</div>

            <div class="zone-food-bottom">

              <div class="zone-food-price">
                ${item.price || ""}
              </div>

              <div class="zone-food-features">
                ${(item.cuisineTypes || item.features || [])
                  .slice(0, 2)
                  .map(x => x.replaceAll("_", " "))
                  .join(" · ")}
              </div>

            </div>

          </div>

        </div>

      `).join("")}

    </div>

  `;

}
loadZone();

</script>

</footer>
</body>
