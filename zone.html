<!DOCTYPE html>
<html lang="en">

<head>

  <link rel="icon" type="image/png" href="favicon-32x32.png">

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Zone</title>

<style>

body {

  margin: 0;

  font-family: Arial, sans-serif;

  background: #f4f7fb;

  color: #111;

}

.zone-page {

  max-width: 1400px;

  margin: 0 auto;

  padding: 20px;

}

.hero {

  height: 260px;

  border-radius: 32px;

  overflow: hidden;

  position: relative;

  margin-bottom: 40px;

}

.hero img {

  width: 100%;

  height: 100%;

  object-fit: cover;

}

.hero-overlay {

  position: absolute;

  inset: 0;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,0.65),
      rgba(0,0,0,0.15)
    );

  display: flex;

  align-items: end;

  padding: 30px;

}

.hero-title {

  color: white;

  font-size: 42px;

  font-weight: bold;

}

.section-title {

  font-size: 30px;

  margin-bottom: 20px;

}

.beach-row {

  display: flex;

  gap: 20px;

  overflow-x: auto;

  scroll-snap-type: x mandatory;

  padding-bottom: 10px;

  scrollbar-width: none;

}

.beach-row::-webkit-scrollbar {

  display: none;

}

.beach-card {

  position: relative;

  min-width: 320px;

  height: 200px;

  border-radius: 28px;

  overflow: hidden;

  flex-shrink: 0;

  cursor: pointer;

  transition: 0.3s ease;

  scroll-snap-align: start;

  box-shadow:
    0 6px 24px rgba(0,0,0,0.10);

}

.beach-card:hover {

  transform: translateY(-4px);

}

.beach-card:hover img {

  transform: scale(1.04);

}

.beach-card img {

  width: 100%;

  height: 100%;

  object-fit: cover;

  transition: 0.4s ease;

}

.beach-overlay {

  position: absolute;

  inset: 0;

  display: flex;

  flex-direction: column;

  justify-content: flex-end;

  padding: 18px;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,0.18),
      transparent 45%
    );

}

.beach-temp {

  position: absolute;

  top: 10px;

  right: 10px;

  background:
    rgba(30,30,30,0.45);

  backdrop-filter: blur(6px);

  color: white;

  height: 28px;

  padding:
    0 8px;

  border-radius: 999px;

  font-size: 15px;

  font-weight: 700;

  display: flex;

  align-items: center;

  gap: 2px;

  line-height: 1;

}
.weather-icon {

  width: 18px;

  height: 18px;

  object-fit: contain;

}

.beach-bottom {

  display: flex;

  justify-content: space-between;

  align-items: flex-end;

  margin-top: auto;

}

.beach-name {

  color: white;

  font-size: 26px;

  font-weight: bold;

  max-width: 70%;

  text-shadow:
    0 2px 10px rgba(0,0,0,0.35);

}

.beach-rating {

  background:
    rgba(255,255,255,0.20);

  backdrop-filter: blur(10px);

  color: white;

  padding:
    6px 12px;

  border-radius: 999px;

  font-size: 15px;

  font-weight: bold;

  margin-bottom: 4px;

}


.quick-buttons {

  display: grid;

  grid-template-columns:
    repeat(auto-fit, minmax(180px, 1fr));

  gap: 18px;

  margin-top: 50px;

}

.quick-btn {

  background: white;

  border-radius: 24px;

  padding: 18px 12px;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  gap: 14px;

  cursor: pointer;

  transition: 0.25s ease;

  box-shadow:
    0 5px 20px rgba(0,0,0,0.06);

  min-height: 120px;

}

.quick-btn-icon {

  width: 42px;

  height: 42px;

  object-fit: contain;

}

.quick-btn-text {

  font-size: 16px;

  font-weight: 700;

  color: #16214a;

  text-align: center;

  line-height: 1.2;

}

.quick-btn:hover {

  transform: translateY(-4px);

}

.quick-btn:hover {

  transform: scale(1.03);

}

@media (max-width: 768px) {

  .hero {

    height: 190px;

  }

  .hero-title {

    font-size: 30px;

  }

  .beach-card {

    min-width: 280px;

  }

}
.site-footer {
  background: #000;
  color: white;
  padding: 30px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
  margin-top: 60px;
}

.footer-left {
  font-size: 14px;
  opacity: 0.85;
}

.footer-right {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
}

.footer-right a {
  color: white;
  text-decoration: none;
  font-size: 14px;
}

</style>

</head>

<body>

<div class="zone-page">

  <div class="hero">

    <img
      id="heroImage"
      src=""
    >

    <div class="hero-overlay">

      <div
        class="hero-title"
        id="zoneTitle">
      </div>

    </div>

  </div>

  <div class="section-title">

    Beaches

  </div>

  <div
    class="beach-row"
    id="beachRow">
  </div>

  <div class="quick-buttons">

  <div class="quick-btn">

    <img
      class="quick-btn-icon"
      src="icons/accommodation.png"
    >

    <div class="quick-btn-text">
      Accommodation
    </div>

  </div>

  <div class="quick-btn">

    <img
      class="quick-btn-icon"
      src="icons/restaurants.png"
    >

    <div class="quick-btn-text">
      Restaurants
    </div>

  </div>

  <div class="quick-btn">

    <img
      class="quick-btn-icon"
      src="icons/beachbars.png"
    >

    <div class="quick-btn-text">
      Beach Bars
    </div>

  </div>

  <div class="quick-btn">

    <img
      class="quick-btn-icon"
      src="icons/carrental.png"
    >

    <div class="quick-btn-text">
      Car Rentals
    </div>

  </div>

  <div class="quick-btn">

    <img
      class="quick-btn-icon"
      src="icons/boat.png"
    >

    <div class="quick-btn-text">
      Boat Rentals
    </div>

  </div>

  <div class="quick-btn">

    <img
      class="quick-btn-icon"
      src="icons/activities.png"
    >

    <div class="quick-btn-text">
      Activities
    </div>

  </div>

</div>

</div>

<script>

async function loadZone() {

  const params =
    new URLSearchParams(window.location.search);

  const zoneId =
    params.get("id");

  document.getElementById("zoneTitle")
    .innerText =
      zoneId;

const heroImages = {

  thessaloniki:
"images/thessaloniki1.webp",

  kassandra:
"images/kassandra1.webp",

  sithonia:
"images/sithonia1.webp",

  olympiada:
"images/olympiada1.webp"

};

document.getElementById("heroImage")
  .src =
    heroImages[
      zoneId.toLowerCase()
    ];
  const response =
    await fetch(

`https://raw.githubusercontent.com/gabridim18-lab/halkidiki-data/main/data/beaches/beaches-index.json`

    );

  const beaches =
    await response.json();

  const filtered =
    beaches.filter(

      item =>

item.zone.toLowerCase() ===
zoneId.toLowerCase()

    );

const beachRow =
  document.getElementById("beachRow");

for (const beach of filtered) {

  console.log(beach);

  const image =

`https://raw.githubusercontent.com/gabridim18-lab/halkidiki-data/main/data/beaches/${beach.id}/images/${beach.previewImage}`;

let temp = "--";
let weatherIcon = "";

if (beach.coordinates) {

  const weatherUrl =

`https://api.weatherapi.com/v1/forecast.json?key=43c0c7ca861d47b48dc160903250408&q=${beach.coordinates.lat},${beach.coordinates.lon}&days=1&aqi=no&alerts=no`;

  try {

    const weatherResponse =
      await fetch(weatherUrl);

    const weatherData =
      await weatherResponse.json();

    if (weatherData.current) {

      temp =
        Math.round(
          weatherData.current.temp_c
        );

      weatherIcon =
        weatherData.current.condition.icon;

    }

  } catch (e) {

    console.log(
      "Weather error:",
      e
    );

  }

}

  beachRow.innerHTML += `

    <div
      class="beach-card"
      onclick="openBeach('${beach.id}')"
    >

      <img src="${image}">

      <div class="beach-overlay">

        <div class="beach-temp">

          <img
            class="weather-icon"
            src="https:${weatherIcon}"
          >

          ${temp}°

        </div>

        <div class="beach-bottom">

          <div class="beach-name">
            ${beach.name.en}
          </div>

          <div class="beach-rating">
            ⭐ ${beach.rating}
          </div>

        </div>

      </div>

    </div>

  `;

}
}
function openBeach(id) {

  window.location.href =
`beach.html?id=${id}`;

}

loadZone();

</script>
<footer class="site-footer">

  <div class="footer-left">
    © 2026 Halkidiki Explorer. All rights reserved.
  </div>

    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html">Terms of Use</a>

  </div>

</footer>
</body>
</html>
