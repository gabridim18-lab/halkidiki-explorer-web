</p>
<div class="filters-bar">

  <div class="filter-group">

   <select id="guestsSelect" class="zone-dropdown">
  <option value="0" data-i18n="guests"></option><option value="0">Guests</option>
  <option value="2">2+</option>
  <option value="3">3+</option>

  <option value="7">7+</option>
  <option value="8">8+</option>
  <option value="9">9+</option>
  <option value="10">10+</option>
</select>

<input
  type="text"
  id="nameSearch"
  class="search-input"
  data-i18n-placeholder="searchBeach"
/>

    <button
  class="filter-pill toggle-pill"
  id="poolFilter"
>
  🏊 Pool
</button>

<button
  class="filter-pill toggle-pill"
  id="petFilter"
>
  🐶 Pet Friendly
</button>

<div class="zone-dropdown-wrapper">

  <select id="zoneSelect" class="zone-dropdown">

    <option
    value=""
    data-i18n="allZones">
</option>

    <option value="Kassandra">
      🟣 Kassandra
    </option>

    <option value="Sithonia">
      🔵 Sithonia
    </option>

    <option value="Thessaloniki">
      🟢 Thessaloniki
    </option>

    </option>

  </select>

</div>

<div class="distance-dropdown-wrapper">

  <select
    id="distanceSelect"
    class="zone-dropdown"
  >

    <option
    value=""
    data-i18n="anyBeachDistance">
</option>

<option
    value="50"
    data-i18n="beachfront">
</option>

<option
    value="300"
    data-i18n="upTo300">
</option>
  </select>

</div>




  </div>

</div>
  <div class="cards-wrapper">

    <button
      class="nav-arrow left-arrow"
      onclick="scrollCards(-1)"
    >
      ‹
    </button>

    <div
      class="cards-container"
      id="cards"
    ></div>

    <button
      class="nav-arrow right-arrow"
      onclick="scrollCards(1)"
    >
      ›
    </button>

  </div>

</section>

<script src="data.js"></script>
<script src="translations.js"></script>

<script>

const cardsContainer =
  document.getElementById("cards");

  let selectedGuests = 0;
   let poolOnly = false;
    let petOnly = false;
    let selectedZone = "";
   let selectedDistance = 0;
let searchName = "";
const savedFilters =
  JSON.parse(
    localStorage.getItem("homeFilters") || "{}"
  );

selectedGuests = savedFilters.selectedGuests || 0;
poolOnly = savedFilters.poolOnly || false;
petOnly = savedFilters.petOnly || false;
selectedZone = savedFilters.selectedZone || "";
selectedDistance = savedFilters.selectedDistance || 0;
searchName = savedFilters.searchName || "";
let loadVersion = 0;

function saveFilters() {

  localStorage.setItem(
    "homeFilters",
    JSON.stringify({
      selectedGuests,
      poolOnly,
      petOnly,
      selectedZone,
      selectedDistance,
      searchName
    })
  );

}

async function loadCards() {

  const currentVersion = ++loadVersion;

  cardsContainer.innerHTML = "";

  for (const item of accommodations) {

    const response =
      await fetch(
        `https://raw.githubusercontent.com/gabridim18-lab/halkidiki-data/main/data/accommodations/${item.id}/index.json`
      );

    if (!response.ok) {

      console.error(
        "Failed to load:",
        item.id
      );

      continue;

    }

    const data =
      await response.json();

      if (currentVersion !== loadVersion) {
  return;
}

      if (

  (
    selectedGuests === 0 ||
    data.guests >= selectedGuests
  )

  &&

  (
    !poolOnly ||
    data.pool === true
  )

  &&

  (
    !petOnly ||
    data.petFriendly === true
  )
  &&

(
  selectedZone === "" ||
  data.zone === selectedZone
)
&&

(
  selectedDistance === 0 ||
  data.distanceMetersOverride <= selectedDistance
)
&&

(
  searchName === "" ||
  data.titleEn.toLowerCase().includes(searchName) ||
  data.titleRo.toLowerCase().includes(searchName)
)



) {

    cardsContainer.innerHTML += `

      <div
        class="flyer-card"
        onclick="openAccommodation('${item.id}')"
       >

        <img
          src="images/${item.flyer}"
          alt="${data.titleEn}"
        >

       </div>
 
        `;
      }

  }

}
document
  .getElementById("poolFilter")
  .addEventListener("click", async () => {

    poolOnly = !poolOnly;

    document
      .getElementById("poolFilter")
      .classList.toggle("active");


    saveFilters();
    await loadCards();

});
document
  .getElementById("distanceSelect")
  .addEventListener("change", async (e) => {

    selectedDistance =
      parseInt(e.target.value) || 0;


    saveFilters();
    await loadCards();

});
document
  .getElementById("petFilter")
  .addEventListener("click", async () => {

    petOnly = !petOnly;

    document
      .getElementById("petFilter")
      .classList.toggle("active");


    saveFilters();
    await loadCards();

});
document
  .getElementById("zoneSelect")
  .addEventListener("change", async (e) => {

    selectedZone = e.target.value;


    saveFilters();
    await loadCards();

});



document
  .getElementById("guestsSelect")
  .addEventListener("change", async (e) => {

    selectedGuests =
      parseInt(e.target.value) || 0;


    saveFilters();
    await loadCards();

  });

document
  .getElementById("nameSearch")
  .addEventListener("input", async (e) => {

    searchName =
      e.target.value.trim().toLowerCase();


    saveFilters();
    await loadCards();

  });

function scrollCards(direction) {

  cardsContainer.scrollBy({

    left: direction * 380,

    behavior: "smooth"

  });

}

function openAccommodation(id) {

  window.location.href =
    `accommodation.html?id=${id}`;

}

document.getElementById("guestsSelect").value =
  selectedGuests;

document.getElementById("zoneSelect").value =
  selectedZone;

document.getElementById("distanceSelect").value =
  selectedDistance || "";

document.getElementById("nameSearch").value =
  searchName;

if (poolOnly) {
  document.getElementById("poolFilter").classList.add("active");
}

if (petOnly) {
  document.getElementById("petFilter").classList.add("active");
}
function scrollToStays() {
  document
    .getElementById("popularStays")
    .scrollIntoView({
      behavior: "smooth"
    });
}
const languageButton =
document.getElementById("languageButton");

const languageMenu =
document.getElementById("languageMenu");

const currentFlag =
document.getElementById("currentFlag");


currentFlag.src =
currentLanguage==="ro"
?
"images/flag_ro.png"
:
"images/flag_en.png";

languageButton.onclick=()=>{

languageMenu.classList.toggle("show");

};

document
.querySelectorAll(".language-option")
.forEach(option=>{

option.onclick=()=>{

const lang=
option.dataset.lang;

localStorage.setItem(
"language",
lang
);

location.reload();

};

});

document.onclick=(e)=>{

if(
!document
.querySelector(".language-selector")
.contains(e.target)
){

languageMenu.classList.remove("show");

}

};


    applyTranslations();

loadCards();

</script>
