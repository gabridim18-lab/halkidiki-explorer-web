<head>

 <meta

  />

    href="style.css"

  <style>
    /* =====================================================
       HOME DYNAMIC ACCOMMODATION CARDS
       All new index styles stay inside this page.
    ===================================================== */

    .home-stay-loading,
    .home-stay-empty {
      flex: 0 0 min(620px, calc(100vw - 32px));
      margin: 12px auto;
      padding: 30px 22px;
      border-radius: 26px;
      background: #ffffff;
      color: #10213a;
      box-shadow: 0 16px 42px rgba(16, 45, 80, 0.12);
      text-align: center;
      font-size: 16px;
      font-weight: 800;
    }

    #cards.cards-container {
      gap: 22px;
      padding: 12px max(52px, calc((100vw - 1180px) / 2)) 30px;
      scroll-snap-type: x mandatory;
      scroll-padding-inline: max(52px, calc((100vw - 1180px) / 2));
    }

    .home-stay-card {
      flex: 0 0 min(520px, calc(100vw - 92px));
      scroll-snap-align: center;
      overflow: hidden;
      border: 1px solid rgba(12, 55, 105, 0.10);
      border-radius: 30px;
      background: #ffffff;
      color: #10213a;
      box-shadow: 0 20px 56px rgba(16, 45, 80, 0.16);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .home-stay-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 26px 68px rgba(16, 45, 80, 0.21);
    }

    .home-stay-main {
      position: relative;
      height: 330px;
      overflow: hidden;
      background: #dce8f3;
    }

    .home-stay-main::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        to top,
        rgba(7, 26, 51, 0.88) 0%,
        rgba(7, 26, 51, 0.18) 48%,
        transparent 72%
      );
    }

    .home-stay-main > img:first-child,
    .home-stay-thumb img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform 0.45s ease;
    }

    .home-stay-card:hover .home-stay-main > img:first-child,
    .home-stay-card:hover .home-stay-thumb img {
      transform: scale(1.025);
    }

    .home-stay-logo {
      position: absolute;
      z-index: 4;
      top: 14px;
      left: 14px;
      width: 72px;
      height: 72px;
      object-fit: contain;
      padding: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 9px 26px rgba(0, 0, 0, 0.24);
    }

    .home-stay-rating {
      position: absolute;
      z-index: 4;
      top: 16px;
      right: 16px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 38px;
      padding: 8px 12px;
      border-radius: 999px;
      color: #071a33;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 8px 24px rgba(7, 26, 51, 0.22);
      font-size: 14px;
      font-weight: 950;
    }

    .home-stay-rating span:first-child,
    .home-stay-beach-rating span:first-child {
      color: #f0a500;
    }

    .home-stay-title {
      position: absolute;
      z-index: 4;
      left: 20px;
      right: 20px;
      bottom: 18px;
      margin: 0;
      color: #ffffff;
      font-size: 27px;
      line-height: 1.08;
      text-shadow: 0 3px 15px rgba(0, 0, 0, 0.72);
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    .home-stay-thumbs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      height: 145px;
      background: #dce8f3;
    }

    .home-stay-thumb {
      position: relative;
      min-width: 0;
      overflow: hidden;
      background: #dce8f3;
    }

    .home-stay-thumb::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        to top,
        rgba(7, 26, 51, 0.80),
        transparent 58%
      );
    }

    .home-stay-beach-link {
      display: block;
      color: inherit;
      text-decoration: none;
    }

    .home-stay-beach-name {
      position: absolute;
      z-index: 3;
      left: 10px;
      right: 10px;
      bottom: 9px;
      color: #ffffff;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.15;
      text-shadow: 0 2px 9px rgba(0, 0, 0, 0.72);
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    .home-stay-beach-rating {
      position: absolute;
      z-index: 3;
      top: 8px;
      right: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 8px;
      border-radius: 999px;
      color: #071a33;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 6px 18px rgba(7, 26, 51, 0.20);
      font-size: 11px;
      font-weight: 950;
    }

    .home-stay-content {
      padding: 18px 20px 22px;
    }

    .home-stay-place-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid #dce7f1;
    }

    .home-stay-place {
      min-width: 0;
    }

    .home-stay-place strong {
      display: block;
      margin-bottom: 4px;
      color: #071a33;
      font-size: 16px;
      font-weight: 950;
    }

    .home-stay-place span {
      display: block;
      color: #66758d;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.3;
    }

    .home-stay-category {
      flex: 0 0 auto;
      max-width: 45%;
      padding: 8px 11px;
      border-radius: 999px;
      color: #005ec7;
      background: #eaf5ff;
      font-size: 11px;
      font-weight: 900;
      text-align: center;
    }

    .home-stay-facts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-top: 14px;
      overflow: hidden;
      border: 1px solid #dce7f1;
      border-radius: 16px;
      background: #f8fbfe;
    }

    .home-stay-fact {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-width: 0;
      padding: 13px 7px;
      white-space: nowrap;
      text-align: center;
    }

    .home-stay-fact + .home-stay-fact {
      border-left: 1px solid #dce7f1;
    }

    .home-stay-fact span,
    .home-stay-fact strong {
      font-size: 14px;
      line-height: 1.1;
    }

    .home-stay-fact span {
      overflow: hidden;
      color: #66758d;
      font-weight: 800;
      text-overflow: ellipsis;
    }

    .home-stay-fact strong {
      flex-shrink: 0;
      color: #071a33;
      font-weight: 950;
    }

    .home-stay-distance {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 14px;
      color: #063b86;
      background: #eef6ff;
      font-size: 14px;
      font-weight: 900;
    }

    .home-stay-action {
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-top: 15px;
      padding: 13px 16px;
      border-radius: 16px;
      color: #ffffff;
      background: linear-gradient(135deg, #087df1, #005ec7);
      box-shadow: 0 12px 28px rgba(8, 125, 241, 0.24);
      text-decoration: none;
      font-size: 15px;
      font-weight: 950;
      transition: transform 0.2s ease;
    }

    .home-stay-action:hover {
      transform: translateY(-2px);
    }

    .cards-wrapper .nav-arrow {
      top: 50%;
      opacity: 0.28;
      transform: translateY(-50%) scale(0.92);
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .cards-wrapper:hover .nav-arrow,
    .cards-wrapper:focus-within .nav-arrow {
      opacity: 0.96;
      transform: translateY(-50%) scale(1);
    }

    .cards-wrapper .nav-arrow:hover:not(:disabled) {
      transform: translateY(-50%) scale(1.08);
    }

    .cards-wrapper .nav-arrow:disabled {
      opacity: 0.12 !important;
      cursor: default;
    }

    @media (max-width: 768px) {
      #cards.cards-container {
        gap: 14px;
        padding: 10px 14px 24px;
        scroll-padding-inline: 14px;
      }

      .home-stay-card {
        flex-basis: calc(100vw - 28px);
        border-radius: 25px;
      }

      .home-stay-main {
        height: 270px;
      }

      .home-stay-logo {
        top: 11px;
        left: 11px;
        width: 58px;
        height: 58px;
      }

      .home-stay-rating {
        top: 12px;
        right: 12px;
        min-height: 34px;
        padding: 7px 10px;
        font-size: 12px;
      }

      .home-stay-title {
        left: 15px;
        right: 15px;
        bottom: 14px;
        font-size: 22px;
      }

      .home-stay-thumbs {
        height: 118px;
      }

      .home-stay-content {
        padding: 15px 13px 18px;
      }

      .home-stay-place strong {
        font-size: 15px;
      }

      .home-stay-place span {
        font-size: 12px;
      }

      .home-stay-category {
        max-width: 43%;
        padding: 7px 9px;
        font-size: 10px;
      }

      .home-stay-fact {
        gap: 4px;
        padding: 12px 4px;
      }

      .home-stay-fact span,
      .home-stay-fact strong {
        font-size: 13px;
      }

      .home-stay-distance {
        padding: 11px 12px;
        font-size: 13px;
      }

      .home-stay-action {
        min-height: 49px;
        margin-top: 13px;
        border-radius: 14px;
        font-size: 14px;
      }
    }
  

    /* ===== MOBILE SWIPE ARROWS ===== */
    @media (max-width: 768px) {
      .cards-wrapper .nav-arrow {
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        top: 50%;
        z-index: 40;
        width: 42px;
        height: 42px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: 50%;
        background: rgba(7, 26, 51, 0.72);
        color: #ffffff;
        box-shadow: 0 8px 24px rgba(7, 26, 51, 0.26);
        opacity: 0.88;
        transform: translateY(-50%);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        font-size: 28px;
        line-height: 1;
      }

      .cards-wrapper .left-arrow {
        left: 7px;
      }

      .cards-wrapper .right-arrow {
        right: 7px;
      }

      .cards-wrapper .nav-arrow:active:not(:disabled) {
        transform: translateY(-50%) scale(0.92);
      }

      .cards-wrapper .nav-arrow:disabled {
        opacity: 0.22 !important;
      }
    }
</style>

</head>

<script>

const cardsContainer =
  document.getElementById("cards");

const HOME_ACCOMMODATIONS_BASE_URL =
  "https://raw.githubusercontent.com/gabridim18-lab/halkidiki-data/main/data/accommodations";

const HOME_BEACHES_INDEX_URL =
  "https://raw.githubusercontent.com/gabridim18-lab/halkidiki-data/main/data/beaches/beaches-index.json";

const HOME_BEACHES_BASE_URL =
  "https://raw.githubusercontent.com/gabridim18-lab/halkidiki-data/main/data/beaches";

const homeCardsPrevious =
  document.getElementById("homeCardsPrevious");

const homeCardsNext =
  document.getElementById("homeCardsNext");

const homeAccommodationCache = new Map();
const homeBeachDetailsCache = new Map();
let homeBeachesIndexPromise = null;

let selectedGuests = 0;
let poolOnly = false;
let petOnly = false;
let selectedZone = "";
let selectedDistance = 0;
let searchName = "";

const savedFilters =
  JSON.parse(
    localStorage.getItem("homeFilters") || "{}"
  );

selectedGuests = savedFilters.selectedGuests || 0;
poolOnly = savedFilters.poolOnly || false;
petOnly = savedFilters.petOnly || false;
selectedZone = savedFilters.selectedZone || "";
selectedDistance = savedFilters.selectedDistance || 0;
searchName = savedFilters.searchName || "";

let loadVersion = 0;

const homeCardTranslations = {
  en: {
    loading: "Loading accommodations...",
    noResults: "No accommodations match the selected filters.",
    guests: "Guests",
    bedrooms: "Bedrooms",
    bathrooms: "Bathrooms",
    beach: "Beach",
    fromBeach: "from the beach",
    viewFull: "View full accommodation",
    detailsUnavailable: "Beach details",
    notSpecified: "Not specified"
  },
  ro: {
    loading: "Se încarcă unitățile de cazare...",
    noResults: "Nicio cazare nu corespunde filtrelor selectate.",
    guests: "Persoane",
    bedrooms: "Dormitoare",
    bathrooms: "Băi",
    beach: "Plajă",
    fromBeach: "până la plajă",
    viewFull: "Vezi cazarea completă",
    detailsUnavailable: "Detalii despre plajă",
    notSpecified: "Nespecificat"
  }
};

function homeText(key) {
  const language = currentLanguage === "ro" ? "ro" : "en";

  return (
    homeCardTranslations[language][key] ||
    homeCardTranslations.en[key] ||
    key
  );
}

function saveFilters() {
  localStorage.setItem(
    "homeFilters",
    JSON.stringify({
      selectedGuests,
      poolOnly,
      petOnly,
      selectedZone,
      selectedDistance,
      searchName
    })
  );
}

async function getHomeAccommodation(item) {
  if (!item?.id) return null;

  if (!homeAccommodationCache.has(item.id)) {
    const request = fetch(
      `${HOME_ACCOMMODATIONS_BASE_URL}/${encodeURIComponent(item.id)}/index.json`,
      { cache: "no-store" }
    )
      .then(response => {
        if (!response.ok) {
          throw new Error(`Accommodation unavailable: ${item.id}`);
        }

        return response.json();
      })
      .then(details => ({
        ...item,
        ...(details || {}),
        id: item.id,
        beachSlug:
          details?.beachSlug ||
          item.beachSlug ||
          ""
      }))
      .catch(error => {
        console.error(error);
        return null;
      });

    homeAccommodationCache.set(item.id, request);
  }

  return homeAccommodationCache.get(item.id);
}

async function getHomeBeachesIndex() {
  if (!homeBeachesIndexPromise) {
    homeBeachesIndexPromise = fetch(
      HOME_BEACHES_INDEX_URL,
      { cache: "no-store" }
    )
      .then(response => {
        if (!response.ok) {
          throw new Error("The beaches index could not be loaded.");
        }

        return response.json();
      })
      .then(items => {
        const map = new Map();

        if (Array.isArray(items)) {
          items.forEach(item => {
            if (item?.id) {
              map.set(
                normalizeHomeId(item.id),
                item
              );
            }
          });
        }

        return map;
      })
      .catch(error => {
        console.warn(error);
        return new Map();
      });
  }

  return homeBeachesIndexPromise;
}

async function getHomeBeachDetails(beachSlug) {
  const normalizedSlug = normalizeHomeId(beachSlug);

  if (!normalizedSlug) return null;

  if (!homeBeachDetailsCache.has(normalizedSlug)) {
    const request = fetch(
      `${HOME_BEACHES_BASE_URL}/${encodeURIComponent(normalizedSlug)}/index.json`,
      { cache: "no-store" }
    )
      .then(response => {
        if (!response.ok) return null;
        return response.json();
      })
      .catch(error => {
        console.warn(
          `Beach details unavailable: ${normalizedSlug}`,
          error
        );
        return null;
      });

    homeBeachDetailsCache.set(normalizedSlug, request);
  }

  return homeBeachDetailsCache.get(normalizedSlug);
}

async function loadCards() {
  const currentVersion = ++loadVersion;

  cardsContainer.innerHTML = `
    <div class="home-stay-loading">
      ${escapeHomeHtml(homeText("loading"))}
    </div>
  `;

  try {
    const [loadedAccommodations, beachesIndexMap] =
      await Promise.all([
        Promise.all(
          accommodations.map(getHomeAccommodation)
        ),
        getHomeBeachesIndex()
      ]);

    if (currentVersion !== loadVersion) return;

    const filteredAccommodations =
      loadedAccommodations
        .filter(Boolean)
        .filter(data => {
          const titleEn =
            String(data.titleEn || "").toLowerCase();

          const titleRo =
            String(data.titleRo || "").toLowerCase();

          const distance =
            getHomeDistanceValue(data);

          return (
            (
              selectedGuests === 0 ||
              Number(data.guests) >= selectedGuests
            ) &&
            (
              !poolOnly ||
              data.pool === true
            ) &&
            (
              !petOnly ||
              data.petFriendly === true
            ) &&
            (
              selectedZone === "" ||
              data.zone === selectedZone
            ) &&
            (
              selectedDistance === 0 ||
              (
                distance !== null &&
                distance <= selectedDistance
              )
            ) &&
            (
              searchName === "" ||
              titleEn.includes(searchName) ||
              titleRo.includes(searchName)
            )
          );
        });

    if (!filteredAccommodations.length) {
      cardsContainer.innerHTML = `
        <div class="home-stay-empty">
          ${escapeHomeHtml(homeText("noResults"))}
        </div>
      `;

      updateHomeArrowState();
      return;
    }

    const cardData = await Promise.all(
      filteredAccommodations.map(async accommodation => {
        const beachSlug =
          accommodation.beachSlug || "";

        const beachIndex =
          beachesIndexMap.get(
            normalizeHomeId(beachSlug)
          ) || null;

        const beachDetails =
          await getHomeBeachDetails(beachSlug);

        return {
          accommodation,
          beachIndex,
          beachDetails
        };
      })
    );

    if (currentVersion !== loadVersion) return;

    cardsContainer.innerHTML = cardData
      .map(renderHomeStayCard)
      .join("");

    requestAnimationFrame(() => {
      cardsContainer.scrollTo({
        left: 0,
        behavior: "auto"
      });

      updateHomeArrowState();
    });
  } catch (error) {
    console.error(error);

    cardsContainer.innerHTML = `
      <div class="home-stay-empty">
        ${escapeHomeHtml(homeText("noResults"))}
      </div>
    `;

    updateHomeArrowState();
  }
}

function renderHomeStayCard({
  accommodation,
  beachIndex,
  beachDetails
}) {
  const title =
    currentLanguage === "ro"
      ? accommodation.titleRo ||
        accommodation.titleEn ||
        accommodation.id
      : accommodation.titleEn ||
        accommodation.titleRo ||
        accommodation.id;

  const images = Array.isArray(accommodation.images)
    ? accommodation.images.filter(Boolean)
    : [];

  const fallbackImage =
    accommodation.image ||
    "images/beach_background.webp";

  const mainImage = images[0] || fallbackImage;
  const secondImage = images[1] || mainImage;
  const thirdImage = images[2] || secondImage;

  const beachName =
    getHomeTranslatedValue(
      beachDetails?.name || beachIndex?.name
    ) ||
    humanizeHomeText(accommodation.beachSlug) ||
    homeText("beach");

  const beachType =
    getHomeTranslatedValue(
      beachDetails?.beachType
    ) ||
    homeText("detailsUnavailable");

  const beachImage =
    getHomeBeachImageUrl(beachIndex) ||
    thirdImage;

  const zone =
    humanizeHomeText(
      accommodation.zone || beachIndex?.zone
    ) || "Halkidiki";

  const category =
    translateHomeCategory(accommodation.category);

  const guests =
    positiveHomeNumber(accommodation.guests) || "—";

  const bedrooms =
    positiveHomeNumber(accommodation.bedrooms) || "—";

  const bathrooms =
    positiveHomeNumber(accommodation.bathrooms) || "—";

  const accommodationRating =
    formatHomeAccommodationRating(
      accommodation.rating,
      accommodation.ratingScale
    );

  const beachRating =
    formatHomeNumber(
      beachIndex?.rating ??
      beachDetails?.recommendationRating
    );

  const distance =
    formatHomeDistance(accommodation);

  const beachHref = accommodation.beachSlug
    ? `beach.html?id=${encodeURIComponent(accommodation.beachSlug)}`
    : "#";

  return `
    <article class="home-stay-card">
      <div class="home-stay-main">
        <img
          src="${escapeHomeAttribute(mainImage)}"
          alt="${escapeHomeAttribute(title)}"
          loading="lazy"
          onerror="this.onerror=null;this.src='images/beach_background.webp'"
        >

        <img
          class="home-stay-logo"
          src="images/logo.png"
          alt="Halkidiki Explorer"
        >

        ${
          accommodationRating
            ? `
              <div class="home-stay-rating">
                <span>★</span>
                <span>${escapeHomeHtml(accommodationRating)}</span>
              </div>
            `
            : ""
        }

        <h3 class="home-stay-title">
          ${escapeHomeHtml(title)}
        </h3>
      </div>

      <div class="home-stay-thumbs">
        <div class="home-stay-thumb">
          <img
            src="${escapeHomeAttribute(secondImage)}"
            alt="${escapeHomeAttribute(title)}"
            loading="lazy"
            onerror="this.onerror=null;this.src='${escapeHomeAttribute(mainImage)}'"
          >
        </div>

        <div class="home-stay-thumb">
          <img
            src="${escapeHomeAttribute(thirdImage)}"
            alt="${escapeHomeAttribute(title)}"
            loading="lazy"
            onerror="this.onerror=null;this.src='${escapeHomeAttribute(secondImage)}'"
          >
        </div>

        <a
          class="home-stay-thumb home-stay-beach-link"
          href="${escapeHomeAttribute(beachHref)}"
          aria-label="${escapeHomeAttribute(beachName)}"
        >
          <img
            src="${escapeHomeAttribute(beachImage)}"
            alt="${escapeHomeAttribute(beachName)}"
            loading="lazy"
            onerror="this.onerror=null;this.src='${escapeHomeAttribute(thirdImage)}'"
          >

          ${
            beachRating
              ? `
                <div class="home-stay-beach-rating">
                  <span>★</span>
                  <span>${escapeHomeHtml(beachRating)}</span>
                </div>
              `
              : ""
          }

          <div class="home-stay-beach-name">
            ${escapeHomeHtml(beachName)}
          </div>
        </a>
      </div>

      <div class="home-stay-content">
        <div class="home-stay-place-row">
          <div class="home-stay-place">
            <strong>${escapeHomeHtml(beachName)}</strong>
            <span>
              ${escapeHomeHtml(zone)} ·
              ${escapeHomeHtml(beachType)}
            </span>
          </div>

          ${
            category
              ? `
                <div class="home-stay-category">
                  ${escapeHomeHtml(category)}
                </div>
              `
              : ""
          }
        </div>

        <div class="home-stay-facts">
          ${renderHomeFact(homeText("guests"), guests)}
          ${renderHomeFact(homeText("bedrooms"), bedrooms)}
          ${renderHomeFact(homeText("bathrooms"), bathrooms)}
        </div>

        <div class="home-stay-distance">
          <span>${escapeHomeHtml(homeText("beach"))}</span>
          <strong>
            ${escapeHomeHtml(distance)}
            ${escapeHomeHtml(homeText("fromBeach"))}
          </strong>
        </div>

        <a
          class="home-stay-action"
          href="accommodation.html?id=${encodeURIComponent(accommodation.id)}"
        >
          <span>🏡</span>
          <span>${escapeHomeHtml(homeText("viewFull"))}</span>
        </a>
      </div>
    </article>
  `;
}

function renderHomeFact(label, value) {
  return `
    <div class="home-stay-fact">
      <span>${escapeHomeHtml(label)}</span>
      <strong>${escapeHomeHtml(value)}</strong>
    </div>
  `;
}

function scrollCards(direction) {
  const firstCard =
    cardsContainer.querySelector(".home-stay-card");

  const cardWidth = firstCard
    ? firstCard.getBoundingClientRect().width
    : 380;

  cardsContainer.scrollBy({
    left: direction * (cardWidth + 22),
    behavior: "smooth"
  });
}

function updateHomeArrowState() {
  const maximumScroll =
    Math.max(
      0,
      cardsContainer.scrollWidth -
      cardsContainer.clientWidth
    );

  homeCardsPrevious.disabled =
    cardsContainer.scrollLeft <= 4;

  homeCardsNext.disabled =
    cardsContainer.scrollLeft >= maximumScroll - 4;
}

cardsContainer.addEventListener(
  "scroll",
  updateHomeArrowState,
  { passive: true }
);

window.addEventListener(
  "resize",
  updateHomeArrowState
);

function normalizeHomeId(value) {
  return String(value || "")
    .trim()
    .toLowerCase();
}

function getHomeTranslatedValue(value) {
  if (!value) return "";

  if (typeof value === "string") {
    return value;
  }

  return (
    value[currentLanguage] ||
    value.en ||
    value.ro ||
    ""
  );
}

function getHomeBeachImageUrl(beachIndex) {
  if (!beachIndex?.id || !beachIndex?.previewImage) {
    return "";
  }

  return (
    `${HOME_BEACHES_BASE_URL}/` +
    `${encodeURIComponent(beachIndex.id)}/images/` +
    `${encodeURIComponent(beachIndex.previewImage)}`
  );
}

function positiveHomeNumber(value) {
  const number = Number(value);

  return Number.isFinite(number) && number > 0
    ? number
    : null;
}

function formatHomeNumber(value) {
  const number = Number(value);

  if (!Number.isFinite(number)) return "";

  return new Intl.NumberFormat(
    currentLanguage === "ro" ? "ro-RO" : "en-GB",
    { maximumFractionDigits: 1 }
  ).format(number);
}

function formatHomeAccommodationRating(
  rating,
  ratingScale
) {
  const value = Number(rating);

  if (!Number.isFinite(value) || value <= 0) {
    return "";
  }

  const formatted = formatHomeNumber(value);
  const scale = Number(ratingScale);

  return Number.isFinite(scale) && scale > 0
    ? `${formatted}/${formatHomeNumber(scale)}`
    : formatted;
}

function getHomeDistanceValue(accommodation) {
  const possibleValues = [
    accommodation.distanceMetersOverride,
    accommodation.distanceToSeaMeters,
    accommodation.distanceMeters,
    accommodation.beachDistanceMeters,
    accommodation.distanceToBeachMeters,
    accommodation.distanceToSea
  ];

  for (const value of possibleValues) {
    if (
      typeof value === "number" &&
      Number.isFinite(value) &&
      value >= 0
    ) {
      return value;
    }

    if (
      typeof value === "string" &&
      value.trim()
    ) {
      const numericValue = Number(
        value
          .replace(",", ".")
          .replace(/[^\d.]/g, "")
      );

      if (
        Number.isFinite(numericValue) &&
        numericValue >= 0
      ) {
        return numericValue;
      }
    }
  }

  return null;
}

function formatHomeDistance(accommodation) {
  const meters = getHomeDistanceValue(accommodation);

  if (meters === null) {
    return homeText("notSpecified");
  }

  if (meters < 1000) {
    return `${Math.round(meters)} m`;
  }

  const kilometers = new Intl.NumberFormat(
    currentLanguage === "ro" ? "ro-RO" : "en-GB",
    { maximumFractionDigits: 1 }
  ).format(meters / 1000);

  return `${kilometers} km`;
}

function translateHomeCategory(category) {
  const normalized = String(category || "")
    .trim()
    .toLowerCase();

  const categoryMap = {
    family_friendly: {
      en: "Family Friendly",
      ro: "Pentru familii"
    },
    perfect_for_groups: {
      en: "Perfect for Groups",
      ro: "Perfectă pentru grupuri"
    },
    couples_retreat: {
      en: "Couples Retreat",
      ro: "Escapadă în cuplu"
    },
    escape_and_relax: {
      en: "Escape & Relax",
      ro: "Relaxare și liniște"
    },
    explorers_choice: {
      en: "Explorer’s Choice",
      ro: "Alegerea Explorerului"
    }
  };

  const translated = categoryMap[normalized];

  if (translated) {
    return translated[
      currentLanguage === "ro" ? "ro" : "en"
    ];
  }

  return humanizeHomeText(normalized);
}

function humanizeHomeText(value) {
  if (!value) return "";

  return String(value)
    .replaceAll("-", " ")
    .replaceAll("_", " ")
    .replace(/\s+/g, " ")
    .trim()
    .split(" ")
    .map(word =>
      word
        ? word.charAt(0).toUpperCase() +
          word.slice(1)
        : word
    )
    .join(" ");
}

function escapeHomeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeHomeAttribute(value) {
  return escapeHomeHtml(value);
}
