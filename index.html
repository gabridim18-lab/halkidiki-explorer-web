<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Halkidiki Explorer</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <section class="hero">
    <section class="discover-section">
      

 <h2>Popular Stays</h2>

<div
  class="cards-container"
  id="cards">
</div>

</section>

    <div class="overlay"></div>

    <div class="hero-content">

      <h1>HALKIDIKI EXPLORER</h1>

      <p>
        Discover beaches, accommodations and restaurants
        in the most beautiful region of Greece.
      </p>

      <div class="hero-buttons">

        <button class="primary-btn">
          Find Accommodation
        </button>

        <button class="secondary-btn">
          Explore Beaches
        </button>

      </div>

    </div>

  </section>
  <script src="data.js"></script>
<script>

const cardsContainer =
  document.getElementById("cards");

async function loadCards() {

  const cardsContainer =
    document.getElementById("cards");

  for (const item of accommodations) {

    const response =
      await fetch(
        `https://raw.githubusercontent.com/gabridim18-lab/halkidiki-data/main/data/accommodations/${item.id}/index.json`
      );

    const data =
      await response.json();

    item.data = data;

    cardsContainer.innerHTML += `

      <div
        class="flyer-card"
        onclick="openAccommodation('${item.id}')"
      >

        <img
          src="images/${item.flyer}"
          alt="${data.titleEn}"
        >

      </div>

    `;

  }

}

loadCards();
function openAccommodation(id) {

  window.location.href =
    `accommodation.html?id=${id}`;

}
</script>
  <script src="script.js"></script>

</body>
</html>
