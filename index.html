<!DOCTYPE html>
<html lang="en">

<head>

<link rel="icon" type="image/png" href="favicon-32x32.png">

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Halkidiki Explorer</title>

  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

<section class="hero">

  <div class="overlay"></div>

  <div class="hero-content">
    
<img
  src="images/logo.png"
  class="home-logo"
  alt="Halkidiki Explorer logo"
/>

    <p>
      Discover beaches, accommodations and restaurants
      in the most beautiful region of Greece.
    </p>

    <div class="hero-buttons">

     <button
  class="primary-btn"
  onclick="scrollToStays()"
>
  Find Accommodation
</button>

     <a
  href="zones.html"
  class="secondary-btn"
>

  Explore Beaches

</a>
<a
  href="favorites.html"
  class="favorites-home-btn"
>
  Saved
</a>

    </div>

  </div>

</section>

<section class="discover-section" id="popularStays">

  <h2>
    Popular Stays
  </h2>

  <p class="swipe-text">

    Swipe to explore and click for details

  </p>
<div class="filters-bar">

  <div class="filter-group">

   <select id="guestsSelect" class="zone-dropdown">
  <option value="0">Guests</option>
  <option value="2">2+</option>
  <option value="3">3+</option>
  <option value="4">4+</option>
  <option value="5">5+</option>
  <option value="6">6+</option>
  <option value="7">7+</option>
  <option value="8">8+</option>
  <option value="9">9+</option>
  <option value="10">10+</option>
</select>

<input
  type="text"
  id="nameSearch"
  class="search-input"
  placeholder="Search by beach name"
/>

    <button
  class="filter-pill toggle-pill"
  id="poolFilter"
>
  🏊 Pool
</button>

<button
  class="filter-pill toggle-pill"
  id="petFilter"
>
  🐶 Pet Friendly
</button>

<div class="zone-dropdown-wrapper">

  <select id="zoneSelect" class="zone-dropdown">

    <option value="">
      🌍 All Zones
    </option>

    <option value="Kassandra">
      🟣 Kassandra
    </option>

    <option value="Sithonia">
      🔵 Sithonia
    </option>

    <option value="Thessaloniki">
      🟢 Thessaloniki
    </option>

    <option value="Olympiada">
      🟡 Olympiada
    </option>

  </select>

</div>

<div class="distance-dropdown-wrapper">

  <select
    id="distanceSelect"
    class="zone-dropdown"
  >

    <option value="">
  🌊 Any Beach Distance
</option>

<option value="50">
  🏖️ Beachfront
</option>

<option value="300">
  🚶 Up to 300m
</option>
  </select>

</div>




  </div>

</div>
  <div class="cards-wrapper">

    <button
      class="nav-arrow left-arrow"
      onclick="scrollCards(-1)"
    >
      ‹
    </button>

    <div
      class="cards-container"
      id="cards"
    ></div>

    <button
      class="nav-arrow right-arrow"
      onclick="scrollCards(1)"
    >
      ›
    </button>

  </div>

</section>

<script src="data.js"></script>

<script>

const cardsContainer =
  document.getElementById("cards");

  let selectedGuests = 0;
   let poolOnly = false;
    let petOnly = false;
    let selectedZone = "";
   let selectedDistance = 0;
let searchName = "";
const savedFilters =
  JSON.parse(
    localStorage.getItem("homeFilters") || "{}"
  );

selectedGuests = savedFilters.selectedGuests || 0;
poolOnly = savedFilters.poolOnly || false;
petOnly = savedFilters.petOnly || false;
selectedZone = savedFilters.selectedZone || "";
selectedDistance = savedFilters.selectedDistance || 0;
searchName = savedFilters.searchName || "";
let loadVersion = 0;

function saveFilters() {

  localStorage.setItem(
    "homeFilters",
    JSON.stringify({
      selectedGuests,
      poolOnly,
      petOnly,
      selectedZone,
      selectedDistance,
      searchName
    })
  );

}

async function loadCards() {

  const currentVersion = ++loadVersion;

  cardsContainer.innerHTML = "";

  for (const item of accommodations) {

    const response =
      await fetch(
        `https://raw.githubusercontent.com/gabridim18-lab/halkidiki-data/main/data/accommodations/${item.id}/index.json`
      );

    if (!response.ok) {

      console.error(
        "Failed to load:",
        item.id
      );

      continue;

    }

    const data =
      await response.json();

      if (currentVersion !== loadVersion) {
  return;
}

      if (

  (
    selectedGuests === 0 ||
    data.guests >= selectedGuests
  )

  &&

  (
    !poolOnly ||
    data.pool === true
  )

  &&

  (
    !petOnly ||
    data.petFriendly === true
  )
  &&

(
  selectedZone === "" ||
  data.zone === selectedZone
)
&&

(
  selectedDistance === 0 ||
  data.distanceMetersOverride <= selectedDistance
)
&&

(
  searchName === "" ||
  data.titleEn.toLowerCase().includes(searchName) ||
  data.titleRo.toLowerCase().includes(searchName)
)



) {

    cardsContainer.innerHTML += `

      <div
        class="flyer-card"
        onclick="openAccommodation('${item.id}')"
       >

        <img
          src="images/${item.flyer}"
          alt="${data.titleEn}"
        >

       </div>
 
        `;
      }

  }

}
document
  .getElementById("poolFilter")
  .addEventListener("click", async () => {

    poolOnly = !poolOnly;

    document
      .getElementById("poolFilter")
      .classList.toggle("active");


    saveFilters();
    await loadCards();

});
document
  .getElementById("distanceSelect")
  .addEventListener("change", async (e) => {

    selectedDistance =
      parseInt(e.target.value) || 0;


    saveFilters();
    await loadCards();

});
document
  .getElementById("petFilter")
  .addEventListener("click", async () => {

    petOnly = !petOnly;

    document
      .getElementById("petFilter")
      .classList.toggle("active");


    saveFilters();
    await loadCards();

});
document
  .getElementById("zoneSelect")
  .addEventListener("change", async (e) => {

    selectedZone = e.target.value;


    saveFilters();
    await loadCards();

});



document
  .getElementById("guestsSelect")
  .addEventListener("change", async (e) => {

    selectedGuests =
      parseInt(e.target.value) || 0;


    saveFilters();
    await loadCards();

  });

document
  .getElementById("nameSearch")
  .addEventListener("input", async (e) => {

    searchName =
      e.target.value.trim().toLowerCase();


    saveFilters();
    await loadCards();

  });

function scrollCards(direction) {

  cardsContainer.scrollBy({

    left: direction * 380,

    behavior: "smooth"

  });

}

function openAccommodation(id) {

  window.location.href =
    `accommodation.html?id=${id}`;

}

document.getElementById("guestsSelect").value =
  selectedGuests;

document.getElementById("zoneSelect").value =
  selectedZone;

document.getElementById("distanceSelect").value =
  selectedDistance || "";

document.getElementById("nameSearch").value =
  searchName;

if (poolOnly) {
  document.getElementById("poolFilter").classList.add("active");
}

if (petOnly) {
  document.getElementById("petFilter").classList.add("active");
}
function scrollToStays() {
  document
    .getElementById("popularStays")
    .scrollIntoView({
      behavior: "smooth"
    });
}
loadCards();

</script>

  <div class="footer-left">

</footer>

</body>

</html>
