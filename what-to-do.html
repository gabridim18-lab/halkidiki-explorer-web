<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>
What To Do
</title>

<style>

body {

  margin: 0;

  font-family: Arial, sans-serif;

  background: #f5f7fa;

  color: #111;

}

.what-page {

  max-width: 1200px;

  margin: 0 auto;

  padding: 20px;

}

.gallery {

  display: flex;

  gap: 16px;

  overflow-x: auto;

  scroll-snap-type: x mandatory;

  scrollbar-width: none;

}

.gallery::-webkit-scrollbar {

  display: none;

}

.gallery img {

  width: 100%;

  max-width: 900px;

  height: 500px;

  object-fit: cover;

  border-radius: 28px;

  flex-shrink: 0;

  scroll-snap-align: center;

}

.header {

  margin-top: 26px;

}

.category {

  display: inline-flex;

  background: #0b63f6;

  color: white;

  padding: 10px 18px;

  border-radius: 999px;

  font-size: 13px;

  font-weight: 700;

}

.title {

  font-size: 42px;

  font-weight: 800;

  margin-top: 18px;

}

.description {

  margin-top: 26px;

  background: white;

  padding: 28px;

  border-radius: 28px;

  line-height: 1.8;

  font-size: 17px;

  box-shadow:
    0 5px 20px rgba(0,0,0,0.08);

}

.section-title {

  font-size: 30px;

  font-weight: 800;

  margin-top: 46px;

  margin-bottom: 20px;

}

.info-box {

  background: white;

  border-radius: 28px;

  padding: 28px;

  box-shadow:
    0 5px 20px rgba(0,0,0,0.08);

}

.info-row {

  display: flex;

  justify-content: space-between;

  gap: 20px;

  padding: 18px 0;

  border-bottom:
    1px solid rgba(0,0,0,0.08);

}

.info-row:last-child {

  border-bottom: none;

}

.info-label {

  font-size: 16px;

  font-weight: 700;

}

.info-value {

  font-size: 16px;

  color: #555;

  text-align: right;

  max-width: 60%;

  line-height: 1.5;

}

.map-btn {

  margin-top: 28px;

  width: 100%;

  border: none;

  background: #0b63f6;

  color: white;

  padding: 18px;

  border-radius: 999px;

  font-size: 17px;

  font-weight: 700;

  cursor: pointer;

}
.description {

  overflow: hidden;

  transition: 0.3s;

}

.description.collapsed {

  max-height: 180px;

}

.see-more-btn {

  margin-top: 14px;

  text-align: center;

  font-size: 15px;

  font-weight: 700;

  color: #0b63f6;

  cursor: pointer;

}
.favorite-btn {

  width: 52px;

  height: 52px;

  border-radius: 50%;

  background: white;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 24px;

  cursor: pointer;

  box-shadow:
    0 5px 20px rgba(0,0,0,0.08);

}

@media (max-width: 768px) {

  .what-page {

    padding: 0;

  }

  .gallery {

    gap: 0;

  }

  .gallery img {

    width: 100vw;

    max-width: 100vw;

    height: 320px;

    border-radius: 0;

  }

  .header {

    padding: 20px 16px 0;

  }

  .title {

    font-size: 32px;

  }

  .description {

    margin: 20px 16px 0;

    padding: 22px;

    border-radius: 24px;

    font-size: 15px;

  }

  .section-title {

    font-size: 24px;

    margin: 38px 16px 18px;

  }

  .info-box {

    margin: 0 16px;

    padding: 20px;

    border-radius: 24px;

  }

  .info-row {

    flex-direction: row;

    align-items: center;

    gap: 16px;

  }

  .info-label {

    font-size: 14px;

  }

  .info-value {

    font-size: 13px;

    max-width: 50%;

  }

}
.site-footer {

  background: #000;

  color: white;

  padding: 30px 20px;

  display: flex;

  justify-content: space-between;

  align-items: center;

  flex-wrap: wrap;

  gap: 15px;

  margin-top: 60px;

}

.footer-left {

  font-size: 14px;

  opacity: 0.85;

}

.footer-right {

  display: flex;

  gap: 18px;

  flex-wrap: wrap;

}

.footer-right a {

  color: white;

  text-decoration: none;

  font-size: 14px;

}
</style>

</head>

<body>

<div class="what-page">

  <div
    class="gallery"
    id="gallery">
  </div>

  <div class="header">

  <div
    style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
    ">

    <div
      class="category"
      id="category">
    </div>

    <div
      class="favorite-btn"

      onclick="toggleFavorite()">

      ❤️

    </div>

  </div>

    <div
      class="category"
      id="category">
    </div>

    <div
      class="title"
      id="title">
    </div>

  </div>

  <div
  class="description collapsed"

  id="description">
</div>

<div
  class="see-more-btn"

  onclick="toggleDescription()">

  See More

</div>

  <div class="section-title">

    Information

  </div>

  <div class="info-box">

    <div class="info-row">

      <div class="info-label">

        📍 Address

      </div>

      <div
        class="info-value"
        id="address">
      </div>

    </div>

    <div class="info-row">

      <div class="info-label">

        🕒 Working Hours

      </div>

      <div
        class="info-value"
        id="hours">
      </div>

    </div>

    <div class="info-row">

      <div class="info-label">

        💶 Price

      </div>

      <div
        class="info-value"
        id="price">
      </div>

    </div>

    <button
      class="map-btn"
      id="mapBtn">

      Open in Google Maps

    </button>

  </div>

</div>

<script src="what_to_do.js"></script>
<footer class="site-footer">

  <div class="footer-left">
    © 2026 Halkidiki Explorer. All rights reserved.
  </div>

  <div class="footer-right">

    <a href="privacy.html">
      Privacy Policy
    </a>

    <a href="terms.html">
      Terms of Use
    </a>

    <a href="#">
      Facebook
    </a>

  </div>

</footer>
</body>

</html>
