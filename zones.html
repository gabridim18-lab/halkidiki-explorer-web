<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Explore Zones</title>

<style>

body {

  margin: 0;

  font-family: Arial, sans-serif;

  background: #f4f7fb;

  color: #111;

}

.page {

  max-width: 1400px;

  margin: 0 auto;

  padding: 20px;

}

.page-title {

  font-size: 48px;

  font-weight: bold;

  margin-bottom: 40px;

}

.zones-grid {

  display: grid;

  grid-template-columns:
    repeat(auto-fit, minmax(320px, 1fr));

  gap: 28px;

}

.zone-card {

  position: relative;

  height: 500px;

  border-radius: 32px;

  overflow: hidden;

  cursor: pointer;

  transition: 0.3s;

  box-shadow:
    0 8px 30px rgba(0,0,0,0.12);

}

.zone-card:hover {

  transform: translateY(-8px);

}

.zone-card img {

  width: 100%;

  height: 100%;

  object-fit: cover;

}

.zone-overlay {

  position: absolute;

  inset: 0;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,0.75),
      rgba(0,0,0,0.15)
    );

  display: flex;

  flex-direction: column;

  justify-content: end;

  padding: 28px;

}

.zone-name {

  color: white;

  font-size: 38px;

  font-weight: bold;

  margin-bottom: 10px;

}

.zone-info {

  color: white;

  font-size: 18px;

  opacity: 0.92;

}

@media (max-width: 768px) {

  .page-title {

    font-size: 34px;

  }

  .zone-card {

    height: 360px;

  }

  .zone-name {

    font-size: 30px;

  }

}

</style>

</head>

<body>

<div class="page">

  <div class="page-title">

    Explore Halkidiki

  </div>

  <div class="zones-grid">

    <div
      class="zone-card"
      onclick="openZone('Thessaloniki')"
    >

      <img
src="https://raw.githubusercontent.com/gabridim18-lab/halkidiki-data/main/data/beaches/thessaloniki/images/thessaloniki1.webp"
      >

      <div class="zone-overlay">

        <div class="zone-name">

          Thessaloniki

        </div>

        <div class="zone-info">

          Urban beaches • City life • Waterfront

        </div>

      </div>

    </div>

    <div
      class="zone-card"
      onclick="openZone('Kassandra')"
    >

      <img
src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
      >

      <div class="zone-overlay">

        <div class="zone-name">

          Kassandra

        </div>

        <div class="zone-info">

          Beach bars • Resorts • Nightlife

        </div>

      </div>

    </div>

    <div
      class="zone-card"
      onclick="openZone('Sithonia')"
    >

      <img
src="https://images.unsplash.com/photo-1493558103817-58b2924bce98"
      >

      <div class="zone-overlay">

        <div class="zone-name">

          Sithonia

        </div>

        <div class="zone-info">

          Crystal water • Hidden beaches • Nature

        </div>

      </div>

    </div>

    <div
      class="zone-card"
      onclick="openZone('Olympiada')"
    >

      <img
src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21"
      >

      <div class="zone-overlay">

        <div class="zone-name">

          Olympiada

        </div>

        <div class="zone-info">

          Calm beaches • Traditional Greece

        </div>

      </div>

    </div>

  </div>

</div>

<script>

function openZone(zone) {

  window.location.href =
`zone.html?id=${zone}`;

}

</script>

</body>
</html>
