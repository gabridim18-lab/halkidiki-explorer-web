<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  Find My Halkidiki
</title>

<link
  rel="stylesheet"
  href="find-my-halkidiki.css"
>

</head>

<body>

<div class="find-page">

  <a
    href="index.html"
    class="back-btn"
  >
    ← Back
  </a>

  <div class="find-header">

    <h1>
      ✨ Find My Halkidiki
    </h1>

    <p>
      Tell us what kind of holiday you dream about.
      Choose as many styles as you like.
    </p>

  </div>

<div class="style-grid">

  <div class="style-card" data-style="fine-sand">
    <img src="images/style/style_fine_sand_en.webp">
  </div>

  <div class="style-card" data-style="relax">
    <img src="images/style/style_relax_en.webp">
  </div>

  <div class="style-card" data-style="family">
    <img src="images/style/style_family_en.webp">
  </div>

  <div class="style-card" data-style="sunset">
    <img src="images/style/style_sunset_en.webp">
  </div>

  <div class="style-card" data-style="crystal">
    <img src="images/style/style_crystal_en.webp">
  </div>

  <div class="style-card" data-style="beachlife">
    <img src="images/style/style_beachlife_en.webp">
  </div>

  <div class="style-card" data-style="urban">
    <img src="images/style/style_urban_en.webp">
  </div>

  <div class="style-card" data-style="hidden">
    <img src="images/style/style_hidden_en.webp">
  </div>

  <div class="style-card" data-style="nature">
    <img src="images/style/style_nature_en.webp">
  </div>

</div>

  <button
    id="continueBtn"
    class="continue-btn"
  >
    Continue →
  </button>

</div>

<script src="find-my-halkidiki.js"></script>

</body>

</html>
