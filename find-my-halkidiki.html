<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  Find My Halkidiki
</title>

<link
  rel="stylesheet"
  href="find-my-halkidiki.css"
>

</head>

<body>

<div class="find-page">

  <a
  href="index.html"
  class="back-circle"
>

<svg
  width="22"
  height="22"
  viewBox="0 0 24 24"
  fill="none"
>

<path
  d="M15 18L9 12L15 6"
  stroke="currentColor"
  stroke-width="2.5"
  stroke-linecap="round"
  stroke-linejoin="round"
/>

</svg>

</a>

  <div class="find-header">

    <h1>
      ✨ Find My Halkidiki
    </h1>

    <p class="find-subtitle">
  Choose up to 3 styles that best match your dream holiday.
</p>

<div id="selectionCounter" class="selection-counter">

  0 of 3 styles selected

</div>

  </div>

<div class="style-grid">

  <div class="style-card" data-style="fine-sand">
    <img src="images/style/style_fine_sand_en.webp">
  </div>

  <div class="style-card" data-style="relax">
    <img src="images/style/style_relax_en.webp">
  </div>

  <div class="style-card" data-style="family">
    <img src="images/style/style_family_en.webp">
  </div>

  <div class="style-card" data-style="sunset">
    <img src="images/style/style_sunset_en.webp">
  </div>

  <div class="style-card" data-style="crystal">
    <img src="images/style/style_crystal_en.webp">
  </div>

  <div class="style-card" data-style="beachlife">
    <img src="images/style/style_beachlife_en.webp">
  </div>

  <div class="style-card" data-style="urban">
    <img src="images/style/style_urban_en.webp">
  </div>

  <div class="style-card" data-style="hidden">
    <img src="images/style/style_hidden_en.webp">
  </div>

  <div class="style-card" data-style="nature">
    <img src="images/style/style_nature_en.webp">
  </div>

</div>

 <button
  id="continueBtn"
  class="continue-btn disabled"
>

  ✨ Show My Match

</button>
<div
  id="stayPreferences"
  class="stay-preferences"
>
<div class="preferences-card">

  <h2 class="step-title">
  ✨ One last thing...
</h2>

<p class="step-subtitle">
  Tell us a little more about your perfect holiday.
</p>

  <div class="pref-group">

    <h3>How many people are coming?</h3>

    <select id="guestCount">

  <option>2</option>
  <option>3</option>
  <option>4</option>
  <option>5</option>
  <option>6</option>
  <option>7</option>
  <option>8</option>
  <option>9</option>
  <option>10+</option>

</select>

  </div>

  <div class="pref-group">

   <h3>
How close do you want to be to the sea?
</h3>

<div class="compact-options">

  <button
    class="compact-option selected"
    data-distance="100"
  >
    Beachfront
  </button>

  <button
    class="compact-option"
    data-distance="500"
  >
    Walkable
  </button>

  <button
    class="compact-option"
    data-distance="2000"
  >
    Nearby
  </button>

  <button
    class="compact-option"
    data-distance="999999"
  >
    Doesn't matter
  </button>

</div>

<h3>Do you want a pool?</h3>
 <div class="compact-options">

  <button
    class="compact-option"
    data-pool="true"
  >
    Yes
  </button>

  <button
    class="compact-option selected"
    data-pool="any"
  >
    Doesn't matter
  </button>

</div>

<h3>Bringing your pet?</h3>
 <div class="compact-options">

  <button
    class="compact-option"
    data-pet="true"
  >
    Yes
  </button>

  <button
    class="compact-option selected"
    data-pet="any"
  >
    No
  </button>

</div>

  <button
    id="findResultsBtn"
    class="continue-btn"
  >

    ✨ Discover My Halkidiki

  </button>

</div>
</div>
</div>
<script src="find-my-halkidiki.js"></script>

</body>

</html>
